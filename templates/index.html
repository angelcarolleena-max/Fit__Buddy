<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitBuddy - AI Fitness Planner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        .header p {
            color: #cbd5e1;
            font-size: 17px;
        }

        .card {
            background: #1e293b;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #e2e8f0;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            color: #0f172a;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #0ea5e9;
        }

        .admin {
            text-align: center;
            margin-top: 25px;
        }

        .admin a {
            color: #38bdf8;
            text-decoration: none;
        }

        .admin a:hover {
            text-decoration: underline;
        }

        .note {
            margin-top: 20px;
            padding: 12px;
            background: #0f172a;
            border-radius: 8px;
            color: #94a3b8;
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                width: 95%;
                margin: 25px auto;
            }

            .card {
                padding: 22px;
            }

            .header h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>💪 FitBuddy</h1>
        <p>AI-Powered Personalized Fitness Plan Generator</p>
    </div>

    <div class="card">

        <form action="/generate-workout" method="post">

            <div class="form-group">
                <label for="user_id">User ID</label>
                <input
                    type="text"
                    id="user_id"
                    name="user_id"
                    placeholder="Example: FB001"
                    required
                >
            </div>

            <div class="form-group">
                <label for="username">Name</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input
                    type="number"
                    id="age"
                    name="age"
                    min="10"
                    max="100"
                    placeholder="Enter your age"
                    required
                >
            </div>

            <div class="form-group">
                <label for="weight">Weight (kg)</label>
                <input
                    type="number"
                    id="weight"
                    name="weight"
                    min="20"
                    max="300"
                    step="0.1"
                    placeholder="Enter your weight"
                    required
                >
            </div>

            <div class="form-group">
                <label for="goal">Fitness Goal</label>

                <select id="goal" name="goal" required>
                    <option value="">Select your goal</option>
                    <option value="Weight Loss">Weight Loss</option>
                    <option value="Muscle Gain">Muscle Gain</option>
                    <option value="General Fitness">General Fitness</option>
                    <option value="Strength">Strength</option>
                    <option value="Endurance">Endurance</option>
                    <option value="Flexibility">Flexibility</option>
                </select>
            </div>

            <div class="form-group">
                <label for="intensity">Workout Intensity</label>

                <select id="intensity" name="intensity" required>
                    <option value="">Select intensity</option>
                    <option value="Beginner">Beginner</option>
                    <option value="Moderate">Moderate</option>
                    <option value="Advanced">Advanced</option>
                </select>
            </div>

            <button type="submit">
                ✨ Generate My 7-Day Plan
            </button>

        </form>

        <div class="note">
            FitBuddy uses AI to create a personalized workout and nutrition plan.
        </div>

    </div>

    <div class="admin">
        <a href="/view-all-users">📊 View All Users</a>
    </div>

</div>

</body>
</html>
